{% extends 'base.html' %}{% block title %}My profile{% endblock %}{% block content %}
<h1 class="h2">My profile</h1>
<form method="post" class="card-s" novalidate><input type="hidden" name="csrf" value="{{ csrf_token() }}">
{% set new = false %}{% include '_student_fields.html' %}
